name: Render video

# Actions tab -> "Render video" -> Run workflow.  The MP4 appears under "Artifacts" when it finishes.
on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Generate narration with edge-tts first (needs internet; skip if public/voice/*.mp3 are committed)"
        type: boolean
        default: true
      frames:
        description: "Optional frame range for a quick test, e.g. 0-90 (empty = whole video)"
        type: string
        default: ""

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # no package-lock.json is committed, so use `npm install` (not `npm ci`)
      - name: Install dependencies
        run: npm install

      - name: Install Chrome system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libnss3 libdbus-1-3 libatk1.0-0 libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2

      - name: Narration (edge-tts)
        if: ${{ inputs.voice }}
        run: |
          pip install edge-tts
          npm run voice

      - name: Build timeline + framing check
        run: npm run check

      - name: Render
        env:
          FRAMES: ${{ inputs.frames }}
        run: |
          EXTRA=""
          if [ -n "$FRAMES" ]; then EXTRA="--frames=$FRAMES"; fi
          npx remotion render src/index.ts Explainer out/video.mp4 --gl=swangle --concurrency=3 $EXTRA

      - uses: actions/upload-artifact@v4
        with:
          name: video
          path: out/video.mp4
